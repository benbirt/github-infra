name: Self updates

# Runs this repository's own bazel-updates.yml nightly on this repository with
# the default inputs. AUTOMATION_TOKEN opens the pull requests so that CI runs
# on them.

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bazel-updates:
    uses: ./.github/workflows/bazel-updates.yml
    secrets:
      AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
