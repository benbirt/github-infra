name: CI

# Lints workflows with actionlint, which also runs shellcheck on every `run:`
# script using the shellcheck preinstalled on GitHub's Ubuntu runners. Checks
# formatting, lints Starlark files and validates the compiled repository list
# against repos.schema.json.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # Updated manually: Dependabot sees neither the actionlint download nor
      # the pipx run pin.
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      CHECK_JSONSCHEMA_VERSION: 0.39.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" actionlint
      - name: Lint workflows
        run: ./actionlint -color
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      # Checks all git-tracked files using the formatters and settings from
      # benbirt/bazel-style.
      - name: Check formatting
        run: bazel run --lockfile_mode=error //tools:format.check
      # Fails on any buildifier warning in a Starlark file.
      - name: Lint Starlark
        run: bazel run --lockfile_mode=error //tools:lint
      - name: Compile the list of repositories
        run: bazel build --lockfile_mode=error //:repos
      - name: Check the list of repositories
        run: pipx run "check-jsonschema==${CHECK_JSONSCHEMA_VERSION}" --schemafile repos.schema.json bazel-bin/repos.json
