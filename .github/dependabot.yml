# Weekly updates of the actions the workflows use and the Python packages in
# schema/requirements.txt.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /schema
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      pip:
        patterns: ["*"]
